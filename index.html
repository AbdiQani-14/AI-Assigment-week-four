
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <div class="header">
            <h2>Calculator</h2>
            <span>Modern Edition</span>
        </div>

        <div class="display">
            <div id="previous-display" class="previous-display"></div>
            <div id="current-display" class="current-display">0</div>
        </div>

        <div class="buttons">

            <button class="clear" data-action="clear">C</button>
            <button class="delete" data-action="delete">DEL</button>
            <button class="operator" data-operator="÷">÷</button>
            <button class="operator" data-operator="×">×</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="+">+</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equals" data-action="equals">=</button>

            <button class="zero" data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button data-action="sign">±</button>

        </div>

        <p class="footer">Designed for simple calculations</p>

    </div>

    <script src="index.js"></script>
</body>
</html>
